<html>
    <head>
        <meta charset="utf-8">
        <script src="main.js"></script>
        <style>
            body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
            .popup { width: 240px; }
            .title {
                margin: 0;
                padding: 14px 16px;
                font-size: 16px;
                font-weight: 600;
                color: #1f2937;
                border-bottom: 1px solid #e5e7eb;
                background: #f9fafb;
            }
            .menu { padding: 6px 0; }
            .item {
                display: flex; align-items: center; justify-content: space-between;
                padding: 10px 16px;
                font-size: 14px;
                color: #1f2937;
                cursor: pointer;
                user-select: none;
            }
            .item:hover { background: #eff6ff; }
            .item .right { color: #059669; font-weight: 600; font-size: 13px; }
        </style>
    </head>
    <body>
        <div class="popup">
            <h4 class="title">MeetMate</h4>
            <div class="menu">
                <div class="item" id="openTeams">
                    <span>Open Microsoft Teams</span>
                </div>
                <div class="item" id="setup">
                    <span>Settings</span>
                </div>
            </div>
        </div>
    </body>
</html>
