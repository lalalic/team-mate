name: Release extension ZIP

on:
  push:
    branches:
      - main
    paths:
      - extension/manifest.json
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      STRIPE_ONE_TIME_PAYMENT_LINK: ${{ secrets.STRIPE_ONE_TIME_PAYMENT_LINK }}
      STRIPE_WEEKLY_PAYMENT_LINK: ${{ secrets.STRIPE_WEEKLY_PAYMENT_LINK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Verify unconfigured safety path
        run: |
          rm -f team-mate.zip
          env -u STRIPE_ONE_TIME_PAYMENT_LINK -u STRIPE_WEEKLY_PAYMENT_LINK -u STRIPE_PAYMENT_LINK npm run build
          node scripts/verify-release-build.mjs
          unzip -t team-mate.zip >/dev/null
      - name: Verify configured production path when payment links are available
        if: ${{ env.STRIPE_ONE_TIME_PAYMENT_LINK != '' || env.STRIPE_WEEKLY_PAYMENT_LINK != '' }}
        env:
          EXPECT_STRIPE_ONE_TIME_CONFIGURED: ${{ env.STRIPE_ONE_TIME_PAYMENT_LINK != '' && '1' || '0' }}
          EXPECT_STRIPE_WEEKLY_CONFIGURED: ${{ env.STRIPE_WEEKLY_PAYMENT_LINK != '' && '1' || '0' }}
        run: |
          rm -f team-mate.zip
          npm run build
          node scripts/verify-release-build.mjs
          unzip -t team-mate.zip >/dev/null
      - name: Verify safe unconfigured release when no Payment Link secret is configured
        if: ${{ env.STRIPE_ONE_TIME_PAYMENT_LINK == '' && env.STRIPE_WEEKLY_PAYMENT_LINK == '' }}
        run: echo "Stripe Payment Links are not configured; the artifact keeps the explicit safe free-plan path."

      - name: Publish GitHub Release
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          TAG="v$VERSION"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG"               --target "$GITHUB_SHA"               --title "$TAG"               --generate-notes
          fi

          gh release upload "$TAG" team-mate.zip --clobber

      - name: Report verified publication
        uses: lalalic/agents-relay/.github/actions/report-publication@publication-v1
        with:
          token: ${{ github.token }}
          artifact: team-mate-extension
          version: ${{ steps.publication.outputs.version }}
          channel: github-release
      - name: Report release failure
        if: ${{ failure() }}
        continue-on-error: true
        uses: lalalic/agents-relay/.github/actions/report-publication-failure@publication-v1
        with:
          token: ${{ github.token }}
          stage: extension release workflow
