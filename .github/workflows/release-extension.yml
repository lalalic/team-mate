name: Release extension ZIP

on:
  push:
    branches:
      - main
    paths:
      - extension/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      STRIPE_PAYMENT_LINK: ${{ secrets.STRIPE_PAYMENT_LINK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - name: Verify unconfigured safety path
        run: |
          rm -f team-mate.zip
          env -u STRIPE_PAYMENT_LINK npm run build
          node scripts/verify-release-build.mjs
          unzip -t team-mate.zip >/dev/null
      - name: Verify configured production path when the secret is available
        if: ${{ env.STRIPE_PAYMENT_LINK != '' }}
        env:
          EXPECT_STRIPE_CONFIGURED: "1"
        run: |
          rm -f team-mate.zip
          npm run build
          node scripts/verify-release-build.mjs
          unzip -t team-mate.zip >/dev/null
      - name: Verify safe unconfigured release when no Payment Link secret is configured
        if: ${{ env.STRIPE_PAYMENT_LINK == '' }}
        run: echo "STRIPE_PAYMENT_LINK is not configured; the artifact keeps the explicit safe free-plan path."

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./extension/manifest.json').version")"
          TAG="v$VERSION"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG"               --target "$GITHUB_SHA"               --title "$TAG"               --generate-notes
          fi

          gh release upload "$TAG" team-mate.zip --clobber
